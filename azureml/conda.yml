# Conda environment for the cascade-prediction training job.
# Kept in sync with ../requirements.txt, plus the MLOps extras that let the
# same training code log to an Azure ML workspace.
name: cascade-train
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip>=23
  - pip:
      - torch>=1.12.0
      - torch-geometric>=2.0.0
      - numpy>=1.21.0
      - scipy>=1.7.0
      - pypsa>=0.25.0
      - pandas>=1.3.0
      - tqdm>=4.62.0
      - psutil>=5.8.0
      - matplotlib>=3.4.0
      - networkx>=2.6.0
      # ── MLOps extras ──
      - mlflow>=2.9
      - azureml-mlflow>=1.55
